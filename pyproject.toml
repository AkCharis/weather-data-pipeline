[project]
name = "weather-data-pipeline"
version = "0.1.0"
description = "Weather Data Ingestion & Quality Pipeline"
readme = "README.md"
authors = [
    { email = "charisakanbi@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "psycopg2>=2.9.13",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
api-data-ingest = "api_data_ingest:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]